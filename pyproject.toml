[tool.ruff]
line-length = 100
extend-exclude = [".aws-sam", ".logs", "data", "dbt/target"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generator with long DAX strings and short type aliases.
"dashboard/powerbi/build_report.py" = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
